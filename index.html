<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5865f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Discord Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Discord Hub</title>
<style>
:root{color-scheme:dark;--bg:#101116;--panel:#1b1d27;--line:#303341;--muted:#a7a9b8;--accent:#5865f2;--green:#3ba55d}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#171a35,#101116 42%);color:#f5f6fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:24px 0 36px}.top{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 24px}.brand{font-size:25px;font-weight:800;letter-spacing:-.6px}.sub{font-size:11px;color:var(--muted);letter-spacing:1.5px;margin-top:4px}.mark{width:48px;height:48px;border-radius:16px;background:var(--accent);display:grid;place-items:center;font-size:25px}
h2{font-size:15px;margin:0}.count{font-size:12px;color:#c9cbda;background:#292c3c;padding:7px 10px;border-radius:30px}
.list{display:grid;gap:12px;margin-top:14px}.card{background:rgba(27,29,39,.94);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 12px 32px #0002}
.person{display:flex;align-items:center;gap:12px}.avatar{width:46px;height:46px;border-radius:50%;background:#30344b;display:grid;place-items:center;font-size:20px;flex:none}.meta{min-width:0;flex:1}.name{font-weight:700;overflow-wrap:anywhere}.handle{font-size:12px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.tag{font-size:11px;color:#b8f2c8;background:#183b29;padding:6px 9px;border-radius:30px}.actions{display:flex;gap:8px;margin-top:15px}.btn{border:0;border-radius:12px;padding:12px 13px;font-weight:700;font-size:13px;cursor:pointer}.primary{background:var(--accent);color:white;flex:1}.secondary{background:#303341;color:#f5f6fa}.danger{background:transparent;color:#ff8c8c;border:1px solid #5a343b}.add{width:100%;margin-top:14px;background:transparent;border:1px dashed #656a83;color:#dfe1ff;padding:15px;border-radius:15px;font-weight:700;font-size:14px}
form{display:none;margin-top:14px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}input{width:100%;background:#11131b;border:1px solid #424657;border-radius:11px;color:white;padding:13px;font:inherit;outline:none}input:focus{border-color:var(--accent)}.formbuttons{display:flex;gap:8px}.formbuttons button{flex:1}
.note{margin-top:22px;padding:14px;border-radius:15px;background:#202331;color:#bfc2d3;font-size:12px;line-height:1.65}.note strong{color:#fff}.empty{text-align:center;color:var(--muted);padding:24px 8px}.foot{text-align:center;color:#777d92;font-size:11px;margin-top:22px}
</style>
</head>
<body>
<main>
  <header class="top"><div><div class="brand">Discord Hub</div><div class="sub">ACCOUNT MANAGER</div></div><div class="mark">◉</div></header>
  <section>
    <div style="display:flex;align-items:center;justify-content:space-between"><h2>マイアカウント</h2><span class="count" id="count">0 / 3 登録済み</span></div>
    <div class="list" id="list"></div>
    <button class="add" id="add">＋ アカウントを追加</button>
    <form class="card" id="form">
      <h2>アカウントを登録</h2>
      <div class="field"><label for="name">表示名 *</label><input id="name" maxlength="32" placeholder="例：メインアカウント" required></div>
      <div class="field"><label for="handle">ユーザー名（任意）</label><input id="handle" maxlength="64" placeholder="例：myname"></div>
      <div class="formbuttons"><button class="btn primary" type="submit">保存する</button><button class="btn secondary" type="button" id="cancel">キャンセル</button></div>
    </form>
  </section>
  <aside class="note"><strong>安全について</strong><br>このアプリは表示名とユーザー名だけをこの端末のブラウザ内に保存します。Discordのパスワードや認証コードは入力しないでください。<br><br>「Discordを開く」は公式ログインページを開きます。アカウントのログイン状態を自動で切り替える機能ではありません。</aside>
  <div class="foot">Discord Hub · 個人用アカウント管理</div>
</main>
<script>
const KEY='discord-hub-accounts-v1';
let accounts=[];
try{accounts=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(accounts))accounts=[];}catch{accounts=[];}
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(accounts));render();}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){
 $('count').textContent=`${accounts.length} / 3 登録済み`;
 $('list').innerHTML=accounts.length?accounts.map((a,i)=>`<article class="card"><div class="person"><div class="avatar">♟</div><div class="meta"><div class="name">${esc(a.name)}</div><div class="handle">${esc(a.handle||'ユーザー名未登録')}</div></div>${a.selected?'<span class="tag">選択中</span>':''}</div><div class="actions"><button class="btn primary" onclick="openDiscord()">Discordを開く</button><button class="btn secondary" onclick="selectAccount(${i})">${a.selected?'選択中':'選択'}</button><button class="btn danger" aria-label="削除" onclick="removeAccount(${i})">削除</button></div></article>`).join(''):'<div class="empty">まだアカウントがありません。<br>「アカウントを追加」から登録できます。</div>';
 $('add').style.display=accounts.length>=3?'none':'block';
}
function openDiscord(){window.open('https://discord.com/login','_blank','noopener');}
function selectAccount(i){accounts=accounts.map((a,j)=>({...a,selected:i===j}));save();}
function removeAccount(i){if(!confirm('この登録情報を削除しますか？'))return;accounts.splice(i,1);if(accounts.length&&!accounts.some(a=>a.selected))accounts[0].selected=true;save();}
window.openDiscord=openDiscord;window.selectAccount=selectAccount;window.removeAccount=removeAccount;
$('add').onclick=()=>{$('form').style.display='block';$('name').focus();};
$('cancel').onclick=()=>{$('form').reset();$('form').style.display='none';};
$('form').onsubmit=e=>{e.preventDefault();if(accounts.length>=3)return;accounts.push({name:$('name').value.trim(),handle:$('handle').value.trim(),selected:accounts.length===0});save();$('form').reset();$('form').style.display='none';};
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script>
</body></html>
